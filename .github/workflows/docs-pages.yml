name: docs-pages

on:
  push:
    branches:
      - main
      - feat/v2-generic-modules
    paths:
      - "docs/**"
      - "scripts/docs/**"
      - "scripts/www/**"
      - "CONTEXT.md"
      - "DESIGN.md"
      - "AGENT_API.md"
      - ".github/workflows/docs-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Assemble static docs artifact with inlined bundle
        run: |
          python3 scripts/docs/assemble_site.py _site
          mkdir -p _site/vendor
          curl -fsSL https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js -o _site/vendor/mermaid.min.js || true

      - name: Upload artifact for VPS deploy
        uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: _site
          retention-days: 3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy-pages:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-vps:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, asterlab-vps]
    steps:
      - name: Download built docs artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-site
          path: _site_stage

      - name: Sync static site to VPS web root and reload Caddy
        env:
          CUSTOM_VPS_DIR: ${{ vars.DOCS_VPS_DIR }}
        run: |
          set -euo pipefail
          STAGE="${PWD}/_site_stage"
          chmod -R a+rX "$STAGE"

          TARGET="${CUSTOM_VPS_DIR:-/var/www/docs.asterlab.party}"
          USE_SUDO=""
          if ! mkdir -p "$(dirname "$TARGET")" 2>/dev/null || { [ -e "$TARGET" ] && [ ! -w "$TARGET" ]; }; then
            if sudo -n true 2>/dev/null; then
              USE_SUDO="sudo -n"
              $USE_SUDO mkdir -p "$(dirname "$TARGET")"
            else
              TARGET="${HOME}/sites/docs.asterlab.party"
              mkdir -p "$(dirname "$TARGET")"
            fi
          fi

          $USE_SUDO rm -rf "${TARGET}.next" "${TARGET}.old"
          $USE_SUDO mkdir -p "${TARGET}.next"
          $USE_SUDO cp -a "${STAGE}/." "${TARGET}.next/"
          $USE_SUDO chmod -R a+rX "${TARGET}.next"
          if [ -d "$TARGET" ]; then
            $USE_SUDO mv "$TARGET" "${TARGET}.old"
          fi
          $USE_SUDO mv "${TARGET}.next" "$TARGET"
          $USE_SUDO rm -rf "${TARGET}.old"

          echo "Deployed static docs to VPS directory: ${TARGET}"

          CADDYFILE=""
          for f in /etc/caddy/Caddyfile /etc/caddy/conf.d/docs.asterlab.party.caddy; do
            if [ -f "$f" ] && grep -q "docs.asterlab.party" "$f"; then
              CADDYFILE="$f"
              break
            fi
          done
          if [ -n "$CADDYFILE" ]; then
            if sudo -n systemctl reload caddy 2>/dev/null || sudo -n caddy reload --config /etc/caddy/Caddyfile 2>/dev/null; then
              echo "Reloaded Caddy for docs.asterlab.party (${CADDYFILE})"
            else
              echo "Synced ${TARGET}; Caddy reload skipped (no passwordless reload needed for static files)."
            fi
          else
            echo "NOTE: Static files are live at ${TARGET}, but Caddyfile does not mention docs.asterlab.party yet."
            echo "Point Caddy at: root * ${TARGET} (see scripts/docs/Caddyfile.docs)"
          fi

  build-www:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage www static bundle
        run: |
          mkdir -p _www_site/assets _www_site/download
          cp scripts/www/*.html _www_site/
          cp scripts/www/download.html _www_site/download/index.html
          if [ -d scripts/www/assets ]; then
            cp -r scripts/www/assets/. _www_site/assets/
          fi
          echo "www.asterlab.party" > _www_site/CNAME

      - name: Upload artifact for VPS www deploy
        uses: actions/upload-artifact@v4
        with:
          name: www-site
          path: _www_site
          retention-days: 3

  deploy-www-vps:
    needs: build-www
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, asterlab-vps]
    steps:
      - name: Download built www artifact
        uses: actions/download-artifact@v4
        with:
          name: www-site
          path: _www_stage

      - name: Sync www static site to VPS web root and reload Caddy
        env:
          CUSTOM_WWW_DIR: ${{ vars.WWW_VPS_DIR }}
        run: |
          set -euo pipefail
          STAGE="${PWD}/_www_stage"
          chmod -R a+rX "$STAGE"

          TARGET="${CUSTOM_WWW_DIR:-/srv/projects/asterlab-web}"
          USE_SUDO=""
          if ! mkdir -p "$(dirname "$TARGET")" 2>/dev/null || { [ -e "$TARGET" ] && [ ! -w "$TARGET" ]; }; then
            if sudo -n true 2>/dev/null; then
              USE_SUDO="sudo -n"
              $USE_SUDO mkdir -p "$(dirname "$TARGET")"
            else
              echo "ERROR: Cannot write to ${TARGET} and passwordless sudo is unavailable." >&2
              exit 1
            fi
          fi

          $USE_SUDO rm -rf "${TARGET}.next" "${TARGET}.old"
          $USE_SUDO mkdir -p "${TARGET}.next"
          $USE_SUDO cp -a "${STAGE}/." "${TARGET}.next/"
          $USE_SUDO chmod -R a+rX "${TARGET}.next"
          if [ -d "$TARGET" ]; then
            $USE_SUDO mv "$TARGET" "${TARGET}.old"
          fi
          $USE_SUDO mv "${TARGET}.next" "$TARGET"
          $USE_SUDO rm -rf "${TARGET}.old"

          echo "Deployed static www site to VPS directory: ${TARGET}"

          if sudo -n systemctl reload caddy 2>/dev/null || sudo -n caddy reload --config /etc/caddy/Caddyfile 2>/dev/null; then
            echo "Reloaded Caddy for www.asterlab.party"
          else
            echo "Synced ${TARGET}; Caddy reload skipped (static files updated in place)."
          fi
