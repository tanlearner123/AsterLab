name: scope-check

# REL-04: a pull request may only touch paths the Kandev card lists under
# `write:` in its `<!-- kandev-scope -->` block. This hosted job injects no
# Kandev API secrets, so the scope block is always read from the PR body
# (which must carry both `<!-- kandev-task: <uuid> -->` and the exact
# `kandev-scope` block). The `scope_check.py` API mode stays available only
# where KANDEV_API_URL/KANDEV_API_TOKEN are explicitly supplied by a
# self-hosted or locally configured step; this hosted workflow exposes neither.
# Contract: scripts/ci/README.md.
#
# Also validates the workflow YAML itself, so a broken CI file fails here.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope-check:
    name: scope-check
    # The VPS host is the only self-hosted Linux runner in the repo.
    # Hosted runner: the repository is public and standard runners are free.
    # Self-hosted runners must never serve a public repository, where fork pull
    # requests would execute untrusted code on the VPS.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --no-tags --prune origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"

      - name: Install pinned actionlint
        run: |
          scripts/ci/install-actionlint.sh "${RUNNER_TEMP}/actionlint-bin"
          echo "${RUNNER_TEMP}/actionlint-bin" >> "${GITHUB_PATH}"

      - name: Validate workflow YAML
        run: actionlint

      - name: Scope parser selftest
        run: python3 scripts/ci/test_scope_check.py

      - name: Enforce card scope on the diff
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -o pipefail
          body_file="${RUNNER_TEMP}/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          status=0
          has_task=0
          has_scope=0
          if grep -Eq '<!--[[:space:]]*kandev-task:[[:space:]]*[0-9A-Fa-f-]{36}[[:space:]]*-->' "$body_file"; then
            has_task=1
          fi
          if grep -Eq '<!--[[:space:]]*kandev-scope' "$body_file"; then
            has_scope=1
          fi
          case "$HEAD_REF" in
            agent/*)
              is_agent_branch=1
              ;;
            *)
              is_agent_branch=0
              ;;
          esac

          if [ "$is_agent_branch" -eq 1 ] || [ "$has_task" -eq 1 ] || [ "$has_scope" -eq 1 ]; then
            if [ "$has_task" -ne 1 ]; then
              echo '::error::scope-check: PR body must carry a valid <!-- kandev-task: <uuid> --> marker' | tee scope-check.log
              status=2
            else
              python3 scripts/ci/scope_check.py \
                --pr-body-file "$body_file" \
                --base "origin/${BASE_REF}" \
                --head HEAD > scope-check.log 2>&1 || status=$?
            fi
          else
            echo "::notice::scope-check: non-agent PR (${HEAD_REF}) without kandev-task marker; card scope diff check skipped (actionlint + parser selftest still enforced)" | tee scope-check.log
          fi
          cat scope-check.log
          {
            echo '## scope-check'
            echo '```text'
            cat scope-check.log
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "$status"
