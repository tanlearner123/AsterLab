name: linux-tests

# Pure-Go Linux gate: validates AsterML SDK contract + Go build and test suite.
# Historical Rust crates are archived and no longer built or tested at runtime.
on:
  pull_request:
  push:
    branches: [main, feat/v2-generic-modules]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-tests:
    name: linux-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Decide scope
        run: |
          set -euo pipefail
          changed=""
          if [ -n "${{ github.base_ref }}" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}" || true
            changed=$(git diff --name-only "FETCH_HEAD...HEAD" 2>/dev/null || true)
          else
            changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          fi
          if [ -z "$changed" ]; then
            echo "RUN_HEAVY=1" >> "$GITHUB_ENV"
            echo "no diff detected; running Pure-Go gate"
          elif printf '%s\n' "$changed" | grep -Eq '^(prototypes/|scripts/sdk/|scripts/ci/|\.github/workflows/)'; then
            echo "RUN_HEAVY=1" >> "$GITHUB_ENV"
            echo "code or SDK change detected; running Pure-Go gate"
          else
            echo "RUN_HEAVY=0" >> "$GITHUB_ENV"
            echo "docs/www-only change; Go tests skipped"
          fi

      - name: Install CJK PDF test font
        if: env.RUN_HEAVY == '1'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-droid-fallback

      - name: Install Go
        if: env.RUN_HEAVY == '1'
        uses: actions/setup-go@v5
        with:
          go-version-file: prototypes/mygo-run/go.mod
          cache-dependency-path: prototypes/mygo-run/go.sum

      - name: SDK contract & registration check
        if: env.RUN_HEAVY == '1'
        run: python3 scripts/sdk/check.py

      - name: UI design-system & typography hygiene check
        if: env.RUN_HEAVY == '1'
        run: python3 scripts/ci/check_ui_hygiene.py

      - name: Go build & tests (Pure-Go Vault + astercore + desktop)
        if: env.RUN_HEAVY == '1'
        working-directory: prototypes/mygo-run
        run: |
          go build ./...
          go test ./internal/... ./cmd/... ./e2e
          go test -run '^TestObsidianVault|^TestV2WorkbenchVisualGate|^TestFSM_|^TestQA[1-4]_|^TestStandalonePantry|^TestVaultIsolatedPantry|^TestVaultLiveDiskWatcher|^TestPantryJSONL|^TestEcosystem' .
